# Pilot 1 of the J(r, K | alpha = 0.5) protocol (docs/studies/pendulum-j-r-k.md): the convergence sentinel.
# The extremes of the design on three non-study seeds: the smallest and the full real fraction; BC, and CCIL with
# learned dynamics at K_max and the largest sigma (the most synthetic rows, the largest perturbations). The learner
# is the study's convergence rule, chosen from the earlier pilots' traces, plus extend_after_stop, which trains each
# unit on to twice its stop step and records what that gained. Run preflight and train only; nothing is evaluated.
study: pendulum-j-r-k-pilot-stopping
task: {variant: continuous, action_bound: 3.0, horizon: 500, eval_episodes: 100, eval_seed: 9601}
data: {path: ../../data/pendulum_cont_corrected.npz,
       sha256: 59c332bc829db9c9da40d9c1bd9ebbf808965aca6a167be48dc0f2ade52cf43c}
split: {validation_fraction: 0.2}
real_fractions: [0.1, 1.0]
synthetic_doses: [20]
arms: [bc, ccil_learned]
seeds: [9501, 9502, 9503]
dynamics: {hidden_layers: [512, 512], activation: relu, lipschitz_type: soft_sampling, lipschitz_constraint: 2.0,
           lipschitz_coordinates: model_normalized, soft_penalty_weight: 0.001, soft_sampling_eps: 0.0003,
           soft_samples: 5, learning_rate: 0.001, weight_decay: 1.0e-05, epochs: 100, batch_size: 512}
# sigma in normalized action units (a fraction of the action bound, 3); proposals truncated to the bound.
generation: {generator: noisy_action_preimage, sigma_grid: [1.0],
             max_failure: 0.05, support_radius: 1.0, max_iterations: 30, tolerance: 0.0001}
learner: {hidden_layers: [256, 256], learning_rate: 0.001, batch_size: 512, epochs: 1,
          observation_scaler: standard, action_scaler: min_max, balance_labels: null,
          step_budget: 400000, checkpoint_selection: validation,
          validation_interval_epochs: 1, validation_min_steps: 100,
          lr_schedule: plateau, lr_factor: 0.2, lr_patience: 20, min_lr: 1.0e-06, patience: 20,
          extend_after_stop: 2, synthetic_fraction: 0.5, synthetic_coverage_before_stop: true}
analysis: {metric: upright_occupancy, confidence: 0.99444, min_pairs: 2,
           contrasts: [[ccil_learned, bc]]}
compute: {device: cuda}
