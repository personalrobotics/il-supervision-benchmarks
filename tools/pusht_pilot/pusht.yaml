# The CCIL configuration of the PushT M=1 pilot: docs/pusht.md at CCIL 56b64b4, data.path set by the runner.
config_version: 4
data: {path: pusht.npz, action_low: [0.0, 0.0], action_high: [512.0, 512.0]}
run: {output_dir: runs}
compute: {device: cpu}
representation: {modality: state+state.environment_state}
transition_model:
  kind: mlp
  fit_episodes: train
  trainer_version: "1"
  hidden_layers: [256, 256]
  activation: relu
  lipschitz_type: spectral_normalization
  lipschitz_constraint: 3.0
  epochs: 50
  batch_size: 256
generation:
  method: noisy_action
  labels_per_transition: 4
  action_noise_scale: training_std
  action_noise_std: 0.1
  recovery_steps: "1"
