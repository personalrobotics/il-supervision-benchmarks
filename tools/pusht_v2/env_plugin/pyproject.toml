[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_env_pusht_history"  # LeRobot imports a plugin by its distribution name, prefix lerobot_env_
version = "1.0.0"
description = "gym_pusht with a two-frame history observation, as a LeRobot 0.6.1 env plugin"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["lerobot_env_pusht_history"]
