# The CCIL configuration of PushT v2 (docs/studies/pusht-v2.md): the pilot's, on the two-frame pose history
# [q_{t-1}, q_t], q = (agent x, y, T x, y, theta) (pose.py), with the history shift structured and preimage labels.
# The runner writes pose.npz beside it; labels are decoded back to the policy's keypoint history.
config_version: 4
data: {path: pose.npz, action_low: [0.0, 0.0], action_high: [512.0, 512.0]}
run: {output_dir: runs}
compute: {device: cpu}
representation: {modality: state+state.pose}
transition_model:
  kind: mlp
  fit_episodes: train
  trainer_version: "1"
  structure: history_shift
  history_steps: 2
  hidden_layers: [256, 256]
  activation: relu
  lipschitz_type: spectral_normalization
  lipschitz_constraint: 3.0
  epochs: 50
  batch_size: 256
generation:
  method: noisy_action_fe
  labels_per_transition: 4
  action_noise_scale: training_std
  action_noise_std: 0.1
  recovery_steps: "1"
