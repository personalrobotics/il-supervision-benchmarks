# The end-to-end fixtures, each run from the built wheel installed in a clean environment (CPU).
name: fixture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installed-wheel:
    runs-on: ubuntu-24.04
    # The study fixture takes about 65-80 minutes on a 4-core runner (6.5 on a 10-core laptop).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - {name: learner-migration, script: tools/learner_check.py, python_flags: -I,
             args: --reference "$RUNNER_TEMP/reference/bin/python"}
          - {name: vertical-slice-fixture, script: tools/fixture.py, python_flags: "", args: ""}
    name: ${{ matrix.fixture.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      - name: Install it in a clean environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" --torch-backend cpu dist/*.whl
      # CCIL's own trainers, which the learner check compares with, last existed at REFERENCE_CCIL (CCIL#168).
      - name: Install the reference CCIL in a second environment
        if: matrix.fixture.name == 'learner-migration'
        run: |
          commit=$(sed -n 's/^REFERENCE_CCIL = "\([0-9a-f]*\)"$/\1/p' tools/learner_check.py)
          torch=$("$RUNNER_TEMP/clean/bin/python" -c 'import torch; print(torch.__version__.split("+")[0])')
          uv venv --python 3.12 "$RUNNER_TEMP/reference"
          uv pip install --python "$RUNNER_TEMP/reference/bin/python" --torch-backend cpu "torch==$torch" \
            "ccil[torch] @ git+https://github.com/personalrobotics/CCIL@$commit"
      - name: Run the fixture
        run: |
          "$RUNNER_TEMP/clean/bin/python" ${{ matrix.fixture.python_flags }} ${{ matrix.fixture.script }} \
            --work "$RUNNER_TEMP/work" --out "evidence/${{ matrix.fixture.name }}.json" ${{ matrix.fixture.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ${{ matrix.fixture.name }}
          path: evidence/
